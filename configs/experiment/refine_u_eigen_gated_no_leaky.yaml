# @package _global_
# Graph UNet with eigen features + gated skip connections, no output activation
defaults:
  - override /model: refine_u

model:
  gcn_type: unet
  feat_type: eigen
  pool_ratios: [0.7, 0.7, 0.7, 0.7]
  unet_loss_weight: 0.2
  output_activation: none
  gated_skip: true

training:
  epochs: 50
  loss: mixed
  seeds: [42]
  ensemble: true
  aug_noise: 0
  aug_edge_drop: 0
