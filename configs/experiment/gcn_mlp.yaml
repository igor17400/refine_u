# @package _global_
# Plain GCN + MLP without any centrality features (uses ones as node features)
defaults:
  - override /model: graph_cent

model:
  gcn_type: traditional
  feat_type: ones

training:
  epochs: 50
  loss: mixed
  splits: 5
  seeds: [42]
  ensemble: true
  aug_noise: 0
  aug_edge_drop: 0
