# @package _global_
# Graph UNet with betweenness centrality features
defaults:
  - override /model: graph_cent

model:
  gcn_type: unet
  feat_type: betweenness
  pool_ratios: [0.7, 0.7, 0.7, 0.7]
  unet_loss_weight: 0.2

training:
  epochs: 50
  loss: mixed
  seeds: [42]
  ensemble: true
  aug_noise: 0
  aug_edge_drop: 0
